<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="サイト終了・移転のお知らせ">
    <title>サイト終了のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>

<body class="container">
    <main>
        <div class="warning-label">重要なお知らせ</div>

        <h1>サイト終了のお知らせ</h1>

        <div class="alert-box">
            <p class="alert-title">⚠ 2026年9月25日をもって終了します</p>
            <p>このサイトは <strong>2026年9月25日</strong> をもって終了します。</p>
            <p>今後、このサイトは利用できなくなるため、<br>
                <strong>新しいサイトへ移動してください。</strong>
            </p>
        </div>

        <div class="move-box">
            <p class="move-title">移転先はこちら</p>
            <a class="move-button" href="https://srev-s.f5.si/">
                新しいサイトへ移動する
            </a>
            <p class="move-url">https://srev-s.f5.si/</p>
        </div>

        <p class="notice">
            ※ 9月25日以降は、このサイトへのアクセスはできなくなります。
        </p>
    </main>
</body>

</html>
